name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/projetointegrador-novo
            git remote -v
            git status --short
            git pull --ff-only origin main
            echo "Commit em deploy: $(git log -1 --oneline)"
            docker build -t projetointegrador-web:${{ github.sha }} -t projetointegrador-web:latest .
            docker stack deploy -c stack.yml cras
            docker service update --force --image projetointegrador-web:${{ github.sha }} cras_web
            docker service ps cras_web --no-trunc | head -5
