{% load static %}
{% load configs %}
{% get_name_if_is_logged as logged_name %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f6fa;
        }
        .card-agendamento {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .titulo {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }
        #resultadoVagas ul {
            padding-left: 0;
            list-style: none;
        }
        #resultadoVagas li {
            background: #ecf0f1;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .badge-vagas {
            background: #3498db;
            color: white;
            padding: 4px 9px;
            border-radius: 5px;
        }
        .sem-vagas {
            color: #e74c3c;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}
</body>
</html>
